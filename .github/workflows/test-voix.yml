name: test-voix
on: push
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { PYTHONUNBUFFERED: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: preches, path: preches, sparse-checkout: resultats, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install edge-tts piper-tts imageio-ffmpeg
      - shell: python
        run: |
          import sys; sys.path.insert(0, ".")
          import asyncio, glob, time, os, subprocess, wave, edge_tts, traduire_preche as t
          txt = open(glob.glob("preches/resultats/*Better-Late*/*.ru.txt")[0], encoding="utf-8").read()
          os.makedirs("echantillons", exist_ok=True)
          extrait = t.decouper(txt, 700)[1]
          async def un(m, v, fichier=None):
              async def g():
                  b = bytearray()
                  async for x in edge_tts.Communicate(m, v).stream():
                      if x["type"] == "audio": b.extend(x["data"])
                  if not b: raise RuntimeError("vide")
                  return b
              try:
                  b = await asyncio.wait_for(g(), 30)
                  if fichier: open(fichier, "wb").write(b)
                  return True
              except Exception: return False
          async def main():
              ms = t.decouper(txt, 1500)[:18]
              for v in ["ru-RU-SvetlanaNeural", "ru-RU-DmitryNeural"]:
                  for _ in range(4):
                      if await un(extrait, v, f"echantillons/microsoft-{v.split('-')[2]}.mp3"): break
          asyncio.run(main())
          base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU"
          for nom in ["ruslan", "denis", "dmitri"]:
              for ext in ("onnx", "onnx.json"):
                  subprocess.run(["curl", "-sSLf", "-o", f"{nom}.{ext}", f"{base}/{nom}/medium/ru_RU-{nom}-medium.{ext}"], check=True)
              subprocess.run(["piper", "-m", f"{nom}.onnx", "-f", f"e-{nom}.wav"], input=extrait.encode(), check=True, capture_output=True)
              import imageio_ffmpeg
              subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-loglevel", "error", "-y", "-i", f"e-{nom}.wav", "-b:a", "64k", f"echantillons/piper-{nom}.mp3"], check=True)
      - run: |
          if git log -1 --format=%s | grep -q "^Échantillons générés"; then exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f echantillons && git commit -m "Échantillons générés" && git push origin HEAD:test-voix
