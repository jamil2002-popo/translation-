name: Traduire une prêche

# Lancé par index.html (bouton « Traduire »), ou à la main depuis l'onglet Actions.
#
# 1. Transcription : un serveur écoute la prêche (Whisper).
# 2. Langues : un serveur par langue, toutes en parallèle (traduction + voix).
# 3. Enregistrement : les fichiers sont rangés sur la branche preches.
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Chemin du fichier audio sur la branche preches (ex. entrees/2026-11-09_1530_ma-preche.mp3)"
        required: true
      langues:
        description: "Langues cibles séparées par des espaces"
        default: "zh es ru hi"
      source:
        description: "Langue parlée dans la prêche"
        default: "en"
      modele:
        description: "Modèle Whisper (base, small, medium)"
        default: "small"

# Les langues figurent dans le titre : la page s'en sert pour afficher le détail.
run-name: "Traduction ${{ inputs.fichier }} · ${{ inputs.langues }}"

permissions:
  contents: write

# Plusieurs prêches peuvent tourner en même temps (chacune dans son dossier).
# On empêche seulement de traduire deux fois la même prêche en parallèle.
concurrency:
  group: preches-${{ inputs.fichier }}
  cancel-in-progress: false

env:
  FICHIER: ${{ inputs.fichier }}
  LANGUES: ${{ inputs.langues }}
  SOURCE: ${{ inputs.source }}
  MODELE: ${{ inputs.modele }}
  PYTHONUNBUFFERED: "1"

jobs:
  transcription:
    name: Transcription
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      nom: ${{ steps.transcrire.outputs.nom }}
      matrice: ${{ steps.transcrire.outputs.matrice }}
    steps:
      - name: Préparation
        uses: actions/checkout@v4

      - name: Récupération de la prêche
        uses: actions/checkout@v4
        with:
          ref: preches
          path: preches
          fetch-depth: 1

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.modele }}

      - name: Installation des outils
        run: pip install -r requirements.txt

      - name: Transcription
        id: transcrire
        run: |
          set -euo pipefail
          case "$FICHIER" in entrees/*) ;; *) echo "Chemin invalide : $FICHIER"; exit 1;; esac
          # La page envoie le fichier en morceaux (.part000, .part001…) : on les recolle.
          if [ ! -f "preches/$FICHIER" ]; then
            ls "preches/$FICHIER".part* >/dev/null
            cat "preches/$FICHIER".part* > "preches/$FICHIER"
            ls -lh "preches/$FICHIER"
          fi
          NOM="$(basename "$FICHIER")"; NOM="${NOM%.*}"
          python traduire_preche.py "preches/$FICHIER" --transcription-seule \
            --source "$SOURCE" --modele "$MODELE" --sortie "preches/resultats/$NOM"
          # Une tâche par langue, sauf celles déjà terminées (MP3 présent) lors d'un essai précédent.
          MATRICE=$(NOM="$NOM" python3 - <<'PY'
          import json, os
          noms = {"zh": "Chinois", "es": "Espagnol", "ru": "Russe", "hi": "Hindi", "en": "Anglais", "fr": "Français"}
          nom, source = os.environ["NOM"], os.environ["SOURCE"]
          a_faire = []
          for code in os.environ["LANGUES"].split():
              mp3 = f"preches/resultats/{nom}/{nom}.{code}.mp3"
              if code in noms and code != source and not (os.path.exists(mp3) and os.path.getsize(mp3) > 0):
                  a_faire.append({"code": code, "nom": noms[code]})
          print(json.dumps(a_faire, ensure_ascii=False))
          PY
          )
          echo "Langues à faire : $MATRICE"
          echo "nom=$NOM" >> "$GITHUB_OUTPUT"
          echo "matrice=$MATRICE" >> "$GITHUB_OUTPUT"

      - name: Envoi de la transcription aux autres serveurs
        uses: actions/upload-artifact@v4
        with:
          name: textes
          path: preches/resultats/${{ steps.transcrire.outputs.nom }}/*.txt
          retention-days: 2

  langue:
    name: ${{ matrix.nom }}
    needs: transcription
    if: needs.transcription.outputs.matrice != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false  # une langue en échec n'arrête pas les autres
      matrix:
        include: ${{ fromJSON(needs.transcription.outputs.matrice) }}
    env:
      NOM: ${{ needs.transcription.outputs.nom }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Préparation
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des outils
        run: |
          pip install -r requirements.txt
          if [ -n "$GEMINI_API_KEY" ]; then pip install google-genai; fi

      - name: Récupération de la transcription
        uses: actions/download-artifact@v4
        with:
          name: textes
          path: sortie/${{ needs.transcription.outputs.nom }}

      - name: Traduction et voix
        run: |
          MOTEUR=google
          if [ -n "$GEMINI_API_KEY" ]; then MOTEUR=gemini; fi
          python traduire_preche.py "entrees/$NOM.mp3" --langues ${{ matrix.code }} \
            --source "$SOURCE" --moteur "$MOTEUR" --sortie "sortie/$NOM"

      - name: Envoi du résultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langue-${{ matrix.code }}
          path: sortie/${{ needs.transcription.outputs.nom }}/*.${{ matrix.code }}.*
          if-no-files-found: ignore
          retention-days: 2

  enregistrement:
    name: Enregistrement
    needs: [transcription, langue]
    # Même si une langue a échoué, on garde tout ce qui est fini :
    # le prochain essai reprendra là où ça s'est arrêté.
    if: always() && needs.transcription.outputs.nom != ''
    runs-on: ubuntu-latest
    env:
      NOM: ${{ needs.transcription.outputs.nom }}
    steps:
      - name: Récupération des prêches
        uses: actions/checkout@v4
        with:
          ref: preches
          path: preches
          fetch-depth: 1

      # D'abord les textes de départ, puis les résultats de chaque langue, qui les
      # remplacent : une traduction corrigée ne doit pas être écrasée par l'ancienne.
      - name: Récupération des textes de départ
        uses: actions/download-artifact@v4
        with:
          name: textes
          path: recus

      - name: Récupération des résultats
        uses: actions/download-artifact@v4
        with:
          pattern: langue-*
          path: recus-langues
          merge-multiple: true

      - name: Enregistrement des résultats
        working-directory: preches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d ../recus-langues ]; then cp ../recus-langues/* ../recus/; fi
          ls -la ../recus
          # On repart toujours de la dernière version de la branche (une autre prêche
          # a pu finir, ou le nettoyage a pu compacter l'historique) et on y ajoute
          # uniquement les fichiers de cette prêche.
          for i in 1 2 3 4 5 6; do
            git fetch --depth=1 origin +refs/heads/preches:refs/remotes/origin/preches
            git checkout -q -f -B enregistrement origin/preches
            mkdir -p "resultats/$NOM"
            cp ../recus/* "resultats/$NOM/"
            git add -f "resultats/$NOM"  # -f : le .gitignore ignore les *.mp3
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -q -m "Résultats : $FICHIER"
            git push origin HEAD:preches && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          exit 1

      - name: Vérification
        if: always()
        run: |
          echo "Transcription : ${{ needs.transcription.result }} — langues : ${{ needs.langue.result }}"
          if [ "${{ needs.transcription.result }}" != "success" ] || [ "${{ needs.langue.result }}" = "failure" ]; then
            echo "Au moins une langue a échoué : relance la traduction pour la réessayer."
            exit 1
          fi
