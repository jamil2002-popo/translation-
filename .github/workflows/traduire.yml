name: Traduire une prêche

# Lancé par index.html (bouton « Traduire »), ou à la main depuis l'onglet Actions.
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Chemin du fichier audio sur la branche preches (ex. entrees/2026-11-09_1530_ma-preche.mp3)"
        required: true
      langues:
        description: "Langues cibles séparées par des espaces"
        default: "zh es ru hi"
      source:
        description: "Langue parlée dans la prêche"
        default: "en"
      modele:
        description: "Modèle Whisper (base, small, medium)"
        default: "small"

run-name: "Traduction ${{ inputs.fichier }}"

permissions:
  contents: write

# Une traduction à la fois : évite les conflits d'écriture sur la branche preches.
concurrency:
  group: preches
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FICHIER: ${{ inputs.fichier }}
      LANGUES: ${{ inputs.langues }}
      SOURCE: ${{ inputs.source }}
      MODELE: ${{ inputs.modele }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Préparation
        uses: actions/checkout@v4

      - name: Récupération de la prêche
        uses: actions/checkout@v4
        with:
          ref: preches
          path: preches
          fetch-depth: 1

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.modele }}

      - name: Installation des outils
        run: |
          pip install -r requirements.txt
          if [ -n "$GEMINI_API_KEY" ]; then pip install google-genai; fi

      - name: Transcription, traduction et voix
        run: |
          set -euo pipefail
          case "$FICHIER" in entrees/*) ;; *) echo "Chemin invalide : $FICHIER"; exit 1;; esac
          # La page envoie le fichier en morceaux (.part000, .part001…) : on les recolle.
          if [ ! -f "preches/$FICHIER" ]; then
            ls "preches/$FICHIER".part* >/dev/null
            cat "preches/$FICHIER".part* > "preches/$FICHIER"
            ls -lh "preches/$FICHIER"
          fi
          NOM="$(basename "$FICHIER")"; NOM="${NOM%.*}"
          MOTEUR=google
          if [ -n "$GEMINI_API_KEY" ]; then MOTEUR=gemini; fi
          # shellcheck disable=SC2086
          python traduire_preche.py "preches/$FICHIER" \
            --langues $LANGUES --source "$SOURCE" --modele "$MODELE" \
            --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      # Même en cas d'échec, on garde ce qui est fini (ex. la transcription) :
      # la prochaine tentative reprendra là où ça s'est arrêté.
      - name: Enregistrement des résultats
        if: always()
        working-directory: preches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f resultats 2>/dev/null || true  # -f : le .gitignore ignore les *.mp3
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "Résultats : $FICHIER"
          for i in 1 2 3 4; do
            git push origin HEAD:preches && exit 0
            sleep $((i * 5)); git pull --rebase origin preches
          done
          exit 1
