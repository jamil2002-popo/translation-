name: Traduire une prêche

# Lancé par index.html (bouton « Traduire »), ou à la main depuis l'onglet Actions.
on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Chemin du fichier audio sur la branche preches (ex. entrees/2026-11-09_1530_ma-preche.mp3)"
        required: true
      langues:
        description: "Langues cibles séparées par des espaces"
        default: "zh es ru hi"
      source:
        description: "Langue parlée dans la prêche"
        default: "en"
      modele:
        description: "Modèle Whisper (base, small, medium)"
        default: "small"

# Les langues figurent dans le titre : la page s'en sert pour afficher le détail.
run-name: "Traduction ${{ inputs.fichier }} · ${{ inputs.langues }}"

permissions:
  contents: write

# Plusieurs prêches peuvent tourner en même temps (chacune dans son dossier).
# On empêche seulement de traduire deux fois la même prêche en parallèle.
concurrency:
  group: preches-${{ inputs.fichier }}
  cancel-in-progress: false

jobs:
  traduire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FICHIER: ${{ inputs.fichier }}
      LANGUES: ${{ inputs.langues }}
      SOURCE: ${{ inputs.source }}
      MODELE: ${{ inputs.modele }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Préparation
        uses: actions/checkout@v4

      - name: Récupération de la prêche
        uses: actions/checkout@v4
        with:
          ref: preches
          path: preches
          fetch-depth: 1

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache du modèle Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.modele }}

      - name: Installation des outils
        run: |
          pip install -r requirements.txt
          # Traduction locale de secours (NLLB), version CPU de PyTorch (plus légère)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece
          if [ -n "$GEMINI_API_KEY" ]; then pip install google-genai; fi

      - name: Transcription
        run: |
          set -euo pipefail
          case "$FICHIER" in entrees/*) ;; *) echo "Chemin invalide : $FICHIER"; exit 1;; esac
          # La page envoie le fichier en morceaux (.part000, .part001…) : on les recolle.
          if [ ! -f "preches/$FICHIER" ]; then
            ls "preches/$FICHIER".part* >/dev/null
            cat "preches/$FICHIER".part* > "preches/$FICHIER"
            ls -lh "preches/$FICHIER"
          fi
          NOM="$(basename "$FICHIER")"; NOM="${NOM%.*}"
          MOTEUR=google
          if [ -n "$GEMINI_API_KEY" ]; then MOTEUR=gemini; fi
          echo "NOM=$NOM" >> "$GITHUB_ENV"
          echo "MOTEUR=$MOTEUR" >> "$GITHUB_ENV"
          python traduire_preche.py "preches/$FICHIER" --transcription-seule \
            --source "$SOURCE" --modele "$MODELE" --sortie "preches/resultats/$NOM"

      # Une étape par langue : la page suit l'avancement de chacune.
      # continue-on-error : une langue en échec n'empêche pas les suivantes.
      - name: Chinois
        id: zh
        if: ${{ contains(format(' {0} ', inputs.langues), ' zh ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues zh --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      - name: Espagnol
        id: es
        if: ${{ contains(format(' {0} ', inputs.langues), ' es ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues es --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      - name: Russe
        id: ru
        if: ${{ contains(format(' {0} ', inputs.langues), ' ru ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues ru --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      - name: Hindi
        id: hi
        if: ${{ contains(format(' {0} ', inputs.langues), ' hi ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues hi --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      - name: Anglais
        id: en
        if: ${{ contains(format(' {0} ', inputs.langues), ' en ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues en --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      - name: Français
        id: fr
        if: ${{ contains(format(' {0} ', inputs.langues), ' fr ') }}
        continue-on-error: true
        run: python traduire_preche.py "preches/$FICHIER" --langues fr --source "$SOURCE" --moteur "$MOTEUR" --sortie "preches/resultats/$NOM"

      # Même en cas d'échec, on garde ce qui est fini (ex. la transcription) :
      # la prochaine tentative reprendra là où ça s'est arrêté.
      - name: Enregistrement des résultats
        if: always()
        working-directory: preches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NOM="$(basename "$FICHIER")"; NOM="${NOM%.*}"
          if [ ! -d "resultats/$NOM" ]; then echo "Rien à enregistrer"; exit 0; fi
          cp -r "resultats/$NOM" "$RUNNER_TEMP/resultat"
          # On repart toujours de la dernière version de la branche (une autre prêche
          # a pu finir, ou le nettoyage a pu compacter l'historique) et on y ajoute
          # uniquement le dossier de cette prêche.
          for i in 1 2 3 4 5 6; do
            git fetch --depth=1 origin +refs/heads/preches:refs/remotes/origin/preches
            git checkout -q -f -B enregistrement origin/preches
            rm -rf "resultats/$NOM"; mkdir -p resultats
            cp -r "$RUNNER_TEMP/resultat" "resultats/$NOM"
            git add -f "resultats/$NOM"  # -f : le .gitignore ignore les *.mp3
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -q -m "Résultats : $FICHIER"
            git push origin HEAD:preches && exit 0
            sleep $((i * 5 + RANDOM % 10))
          done
          exit 1

      - name: Vérification
        if: always()
        run: |
          echo "zh=${{ steps.zh.outcome }} es=${{ steps.es.outcome }} ru=${{ steps.ru.outcome }} hi=${{ steps.hi.outcome }} en=${{ steps.en.outcome }} fr=${{ steps.fr.outcome }}"
          if echo "${{ steps.zh.outcome }} ${{ steps.es.outcome }} ${{ steps.ru.outcome }} ${{ steps.hi.outcome }} ${{ steps.en.outcome }} ${{ steps.fr.outcome }}" | grep -q failure; then
            echo "Au moins une langue a échoué : relance la traduction pour la réessayer."
            exit 1
          fi
